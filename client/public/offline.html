<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F4EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0A0D0B" media="(prefers-color-scheme: dark)" />
    <title>10IS · Offline</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --bg: #f6f4ee; --ink: #101814; --muted: #5c665f; --brand: #c8102e; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0a0d0b; --ink: #f0efe8; --muted: #969e97; --brand: #e82c48; } }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow-x: clip; }
      body {
        display: grid; place-items: center; text-align: center;
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Inter Tight", "Segoe UI", sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font: 400 2.4rem/1.05 "Instrument Serif", Georgia, serif; margin: 20px 0 8px; }
      p { color: var(--muted); max-width: 22rem; margin: 0 auto; }
      button {
        margin-top: 28px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
        background: var(--brand); color: #fff; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="10IS" />
      <h1>You're offline</h1>
      <p>10IS needs a connection to load this page. Your bag and bookings will be right here when you're back in signal.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
